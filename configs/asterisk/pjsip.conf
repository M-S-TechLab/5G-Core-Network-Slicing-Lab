; ====================================================================
; Open5GS 5G Slicing Lab - Asterisk PJSIP Configuration (SST 2 / URLLC)
; ====================================================================

[global]
type=global
user_agent=Asterisk-5G-Lab

; --- UDP Transport ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Endpoint Template ---
[endpoint-template](!)
type=endpoint
context=from-internal
disallow=all
allow=alaw
allow=ulaw
allow=g722
direct_media=no

; --- UE1 / Extension 1001 ---
[1001](endpoint-template)
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
password=1001password
username=1001

[1001]
type=aor
max_contacts=1
remove_existing=yes

; --- UE2 / Extension 1002 ---
[1002](endpoint-template)
auth=auth1002
aors=1002

[auth1002]
type=auth
auth_type=userpass
password=1002password
username=1002

[1002]
type=aor
max_contacts=1
remove_existing=yes
