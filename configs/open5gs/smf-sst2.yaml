logger:
  file:
    path: /var/log/open5gs/smf2.log

global:
  max:
    ue: 1024

smf:
  sbi:
    server:
      - address: 127.0.0.24
        port: 7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
  pfcp:
    server:
      - address: 127.0.0.24
    client:
      upf:
        - address: 127.0.0.8
  gtpc:
    server:
      - address: 127.0.0.24
  gtpu:
    server:
      - address: 127.0.0.24
  metrics:
    server:
      - address: 127.0.0.24
        port: 9091
  session:
    - subnet: 10.46.0.0/16
      gateway: 10.46.0.1
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400
  info:
    - s_nssai:
        - sst: 2
          dnn:
            - internet
